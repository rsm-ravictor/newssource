# Report-type definitions. Everything that differs between the Tenants digest and
# the Competitors digest lives here — categories, judging criteria, wording — so
# neither the email template nor the scripts hardcode either one.
#
# The `criteria`, `rank_note` and `tier_note` blocks below are the authored rubrics;
# competitor-intelligence-rubric.md and tenant-intelligence-rubric.md at the repo
# root are the prose originals. They are read in two places and only two:
#   - judge.criteria_for()     -> the system prompt for every judging call
#   - serve.render_reference() -> the "what counts as meaningful" card on /reference
# so what a reviewer approves on that page is literally what the run sends.
#
# WHEN THE REAL WATCHLISTS ARRIVE:
#   1. Paste the names into the file named by `watchlist` (one per line).
#   2. Adjust `categories` and `criteria` below if the signals that matter differ.
#      The competitors block currently assumes RIVAL LANDLORDS / OWNER-OPERATORS —
#      firms you compete with for tenants. If your competitors are instead your
#      tenants' competitors, or brokerages, rewrite that block; nothing else changes.

# Name shown in the banner and footer of every briefing.
briefing_name: AAT Intel Briefing

# Severity styling, shared by both report types. The KEYS stay high/medium/low
# because that is what the judge model returns and what --priorities filters on;
# only the displayed labels are the Urgent / Watch / Informational wording.
priorities:
  high:   {label: Urgent,        dot: '#d92d20', fg: '#b42318', bg: '#fef3f2'}
  medium: {label: Watch,         dot: '#f79009', fg: '#b54708', bg: '#fffaeb'}
  low:    {label: Informational, dot: '#2e90fa', fg: '#175cd3', bg: '#eff8ff'}

# Lookback windows offered by the live runner (days).
lookback_presets: [7, 30, 90]

# Tavily search settings shared by both types.
search:
  max_results_per_query: 5
  search_depth: basic
  sleep_between_calls: 0.5

# Source reliability -> reading order. NOT a filter: nothing is ever dropped for
# where it came from, and every source still reaches the digest. Tier is the third
# sort key, never the first - it only orders findings that already share a priority
# (and, on the tenant side, a roster rank). An urgent social-sourced finding still
# leads a routine wire story; severity and rank stay the rubric's axes.
#
# Listed best-first. A domain matching nothing below lands at `default_position`,
# and a subdomain matches its parent (m.facebook.com -> facebook.com).
source_tiers:
  default_position: 4
  order:
    - label: Wire & filings
      hint: newswires, national business press, and the SEC - the system of record
      domains:
        - reuters.com
        - bloomberg.com
        - wsj.com
        - ft.com
        - apnews.com
        - cnbc.com
        - barrons.com
        - sec.gov
    - label: CRE trade press
      hint: the outlets that cover leasing and investment sales directly
      domains:
        - costar.com
        - bisnow.com
        - therealdeal.com
        - globest.com
        - commercialobserver.com
        - connectcre.com
        - rebusinessonline.com
        - bizjournals.com
    - label: Company-issued
      hint: authoritative for what a company says about itself, promotional in framing
      domains:
        - prnewswire.com
        - businesswire.com
        - globenewswire.com
        - stocktitan.net
    - label: General & unlisted
      hint: local papers, trade blogs, and any domain not named on this page
      domains: []
    - label: Social & user-posted
      hint: kept for signal - never leads a priority band
      domains:
        - facebook.com
        - x.com
        - twitter.com
        - linkedin.com
        - instagram.com
        - reddit.com
        - youtube.com
        - tiktok.com
        - threads.net
        - medium.com
        - substack.com
        - quora.com

report_types:

  # ─────────────────────────────────────────────────────────────────────────
  tenants:
    label: Tenants
    brandmark: Tenant Intelligence
    title: Portfolio developments
    subject_prefix: 'Tenant intel'
    entity_noun: tenant
    entity_noun_plural: tenants
    monitored_label: tenants monitored
    affected_label: tenants affected
    from_name: Tenant Intelligence
    from_address: tenant-intel@yourfirm.com
    to_address: asset-management@yourfirm.com
    watchlist: tenant-list.md
    # The roster's "#" column is the priority rank, and the tenant side is the
    # side that uses it: rank reaches the judge in stage 2 and breaks ties in the
    # email's reading order. Competitors have no rank column, so they get none.
    use_rank: true
    articles: data/mock_articles_tenants.json
    alerts: data/sample_alerts_tenants.json
    privacy_note: >-
      only tenant names were sent to the search provider. Rent, lease terms, addresses, and the
      portfolio list never left the local database.

    # THE ENTIRE PRIVACY SURFACE. Only {name} and {city} may appear here - never rent,
    # square footage, lease dates, building names, or anything else from the rent roll.
    # tests/test_search.py asserts that built queries contain nothing but those two.
    query_templates:
      - '"{name}" {city} layoffs OR bankruptcy OR restructuring OR default OR "cost cutting"'
      - '"{name}" {city} office lease OR headquarters OR relocation OR expansion OR sublease'

    categories:
      financial_distress:  {label: Financial distress, bg: '#fef3f2', fg: '#b42318'}
      expansion:           {label: Expansion,          bg: '#ecfdf3', fg: '#027a48'}
      office_move:         {label: Office move,        bg: '#eff8ff', fg: '#175cd3'}
      leadership_change:   {label: Leadership change,  bg: '#f4f3ff', fg: '#5925dc'}
      ma_ownership_change: {label: M&A / ownership,    bg: '#fdf2fa', fg: '#c11574'}

    criteria: |
      You are a commercial real-estate analyst screening news about tenants in a landlord's
      portfolio. For each article, decide whether it is a MEANINGFUL development that a landlord's
      asset-management team would act on. Your primary objective is signal-to-noise: surface
      developments that materially change the landlord's view of a tenant, and suppress news that
      merely fits a category without changing a leasing, credit, relationship, or portfolio
      decision.

      RELEVANT categories (pick exactly one):
      - financial_distress: covenant breaches, defaults, restructuring/bankruptcy advisors,
        layoffs, going-concern doubt, missed payments, credit downgrades. Also loss of a major
        contract or government funding where that is a material part of the tenant's revenue base,
        credit events at a parent company or lease guarantor, and for retail tenants, announced
        store closure lists or sustained same-store-sales deterioration. Treat layoffs as a
        standalone finding only when they are material in magnitude, tied to the occupied
        market/business unit, or part of a broader pattern of distress. Treat retail sales
        deterioration as a standalone finding only when it is severe, sustained, or paired with
        closures, liquidity pressure, or other evidence of credit deterioration.
      - expansion: funding rounds or contracts that fund growth, headcount growth, new locations,
        stated intent to take more space. A funding round, contract win, or hiring announcement is
        not relevant by itself unless it credibly increases the probability of additional
        headcount, locations, or space demand in a market relevant to the landlord.
      - office_move: consolidations, relocations, subleasing, headquarters changes, footprint
        reductions, space searches, lease decisions. Also the tenant listing its own space for
        sublease - treat that as a high-value early give-back signal - and company-wide
        return-to-office, hybrid or remote policy changes that materially alter space demand. Give
        greatest weight to decisions affecting the occupied building, submarket, metro, or business
        unit; remote-office actions elsewhere should not be elevated unless they reveal a
        company-wide footprint strategy.
      - leadership_change: CEO/CFO/managing-partner changes, or leadership changes explicitly tied
        to a real-estate or cost-strategy review. Do not automatically alert on an otherwise
        routine executive transition. Treat it as a standalone finding when the change is abrupt,
        linked to distress or a strategic/cost review, involves a material tenant exposure, or
        plausibly changes a pending lease or relationship decision; otherwise retain it only as an
        indicator.
      - ma_ownership_change: announced or completed mergers, acquisitions, take-privates, or
        divestitures involving the tenant, whether as acquirer or target. Treat the transaction as
        relevant when it is material to the tenant or could plausibly change control, credit,
        headcount, local footprint, or lease strategy. Treat it as a potential space event; assess
        local office overlap and integration plans rather than assuming consolidation. Note in the
        summary which side of the deal the tenant is on.

      EXCLUDE (set is_relevant=false and fill reason_if_excluded):
      - Routine business news with no space or credit implication.
      - Product launches, feature releases, pricing news.
      - Marketing, awards, sponsorships, "best places to work", CSR announcements.
      - Minor personnel changes below the executive level, ordinary associate or staff hires.
      - Opinion pieces, listicles, and articles that merely mention the company in passing.
      - Routine earnings beats/misses, modest workforce changes, ordinary financings, generic
        hiring, fundraising, or transactions that do not meet the relevance criteria above.
      - A single weak indicator with no concrete lease, credit, or relationship implication. Retain
        it for the watchlist if it could become meaningful when combined with later signals.
      - Exclusions are category-based, not tenant-based. No tenant is too small for a real signal
        to be reported. However, tenant size alone never converts ordinary business news into a
        meaningful finding.

      GEOGRAPHIC SCOPING: determine whether the event is tied to the market where the tenant
      occupies the landlord's space. Local events - layoffs, WARN notices, closures, or expansions
      in that metro - are weighted one priority level higher than the same event elsewhere.
      Company-wide distress always remains relevant, but say explicitly in the summary whether the
      occupied market is affected.

      PRIORITY rubric:
      - high: an act-this-week signal. Credit risk to rent collection, or a concrete
        move/expansion decision that affects space demand now.
      - medium: a real signal worth tracking that has no immediate action attached.
      - low: a potentially useful indicator that has not crossed the threshold for a standalone
        alert. Retain it in the watchlist/background layer; do not send it as a normal tenant alert
        unless specifically requested.

      TIMING MULTIPLIER: if the tenant's lease expiration is within 24 months, bump any
      space-related signal - office_move, expansion, ma_ownership_change - up one priority level. A
      space search by a tenant expiring in 2027 is a different event than the same search by a
      tenant locked in through 2033. Lease dates are never sent to you, so apply this only when the
      article itself establishes the expiration.

      CEO FLAG, separate from priority: set ceo_flag=true only when the item is important enough to
      merit inclusion in a short CEO morning brief. Examples: a confirmed credit event that could
      threaten rent collection or tenant viability; a concrete space decision affecting the
      landlord's property/market or a major ABR concentration; M&A that materially changes the
      tenant's control, credit, local footprint, or lease strategy; a meaningful signal involving a
      top-10 ABR concentration; or an event involving a publicly disclosed tenant that could
      reasonably surface in an earnings call, analyst question, board discussion, or financial press
      coverage tied to the landlord.
      Priority answers "how fast should the team move"; the CEO flag answers "does leadership need
      to know." An item can be medium priority and still carry the flag. Do not set ceo_flag merely
      because an event technically fits a category. If the landlord implication would feel trivial
      or would require a long explanation to justify why the CEO should care, set ceo_flag=false.

    # Appended to `criteria` for this report type only (judge.criteria_for).
    rank_note: |
      RANKING -> PRIORITIZATION: each tenant carries a rank from the roster, where 1 is the largest
      and most important tenant in its segment and a high number is a small one. Every tenant in
      the roster is in scope. Rank never makes an article relevant or irrelevant, and it never
      suppresses a finding. It only adjusts escalation:
      - Top 25: escalate. Medium becomes high when rent collection or a space decision is plausibly
        at stake.
      - Rank 26-150: apply the standard rubric with no adjustment in either direction.
      - Rank 151+: report everything that passes the relevance test. Concrete, decided events - a
        filed bankruptcy, a signed sublease, an announced closure of the occupied location - earn
        high exactly as they would for a large tenant. Do not inflate speculative or soft items;
        those are medium at most.

  # ─────────────────────────────────────────────────────────────────────────
  competitors:
    label: Competitors
    brandmark: Competitor Intelligence
    title: Competitive activity
    subject_prefix: 'Competitor intel'
    entity_noun: competitor
    entity_noun_plural: competitors
    monitored_label: competitors monitored
    affected_label: competitors active
    from_name: Competitor Intelligence
    from_address: market-intel@yourfirm.com
    to_address: acquisitions@yourfirm.com
    watchlist: competitor-list.md
    articles: data/mock_articles_competitors.json
    alerts: data/sample_alerts_competitors.json
    privacy_note: >-
      only competitor names were sent to the search provider. Your own portfolio, rents, and
      pipeline never left the local database.

    # Same rule as above: {name} and {city} only.
    query_templates:
      - '"{name}" {city} acquires OR acquisition OR sells OR portfolio OR "breaks ground"'
      - '"{name}" {city} lease OR leasing OR fund OR refinancing OR occupancy OR vacancy'

    categories:
      acquisition:               {label: Acquisition,      bg: '#eff8ff', fg: '#175cd3'}
      disposition:               {label: Disposition,      bg: '#fffaeb', fg: '#b54708'}
      development:               {label: Development,      bg: '#ecfdf3', fg: '#027a48'}
      leasing:                   {label: Leasing,          bg: '#f0f9ff', fg: '#026aa2'}
      capital:                   {label: Capital,          bg: '#fef3f2', fg: '#b42318'}
      leadership_change:         {label: Leadership,       bg: '#f4f3ff', fg: '#5925dc'}
      pricing_valuation_comps:   {label: Pricing comps,    bg: '#fdf2fa', fg: '#c11574'}
      corporate_investor_events: {label: Corporate events, bg: '#f0fdf9', fg: '#107569'}

    criteria: |
      You are a commercial real-estate analyst tracking RIVAL LANDLORDS AND OWNER-OPERATORS —
      firms your company competes with to win and keep commercial tenants. For each article,
      decide whether it is a MEANINGFUL competitive development your acquisitions and asset
      management teams would act on.

      RELEVANT categories (pick exactly one):
      - acquisition: buying buildings, portfolios, or platforms; entering a submarket by purchase;
        winning a bid you may also have chased. Capture price, per-SF or per-unit metric, and cap
        rate whenever disclosed.
      - disposition: selling assets, exiting a submarket, portfolio pruning, recapitalizations that
        hand over control. A peer exiting a segment or market you are in is a strategic signal, not
        just a trade; say so in the summary.
      - development: groundbreakings, new construction, major repositioning or renovation that adds
        competing supply. Track entitlement filings, land assemblages, preliminary redevelopment
        plans and similar early-stage activity as indicators or watchlist items. Elevate them to a
        normal finding when scale is material and there is evidence the project is becoming
        actionable, such as a formal entitlement application, financing/JV commitment, demolition,
        permits, a construction contract or groundbreaking.
      - leasing: report a tenant signing when it involves one of the landlord's tenants or known
        prospects, absorbs or vacates a material block of competing space, establishes a meaningful
        rent/concession comp, or is otherwise strategically important to the submarket. Also report
        material occupancy, asking-rate or concession changes when they provide useful competitive
        information. Flag explicitly when the tenant involved is one of your tenants or a prospect
        known to be in the market; competitor courtship of your rent roll is always high. Routine
        leasing announcements with no meaningful competitive implication should be excluded.
      - capital: capital events that materially change a competitor's acquisition or development
        capacity, cost of capital, leverage/liquidity profile or strategic flexibility, including
        significant fund closes, equity issuance, debt financing or recapitalizations, and distress
        on their own balance sheet. Exclude ordinary refinancings, routine credit-facility
        amendments and other financing activity that does not materially change competitive
        capacity or financial condition. For Tier 2 public peers, apply the
        corporate_investor_events standard below.
      - leadership_change: CEO/CIO/head-of-leasing changes, or team hires that signal a strategy or
        market shift.
      - pricing_valuation_comps: transactions or appraisals that establish a cap rate, per-SF, or
        per-unit data point for product comparable to yours in a market of interest, regardless of
        which firm traded it. These prints feed NAV narratives and analyst models even when the
        deal itself is not actionable. Report only when the asset is sufficiently comparable by
        market/submarket, property type, quality and transaction timing to provide a useful
        valuation data point. State briefly why the transaction is a meaningful comp for the
        landlord. A transaction occurring in the same broad market is not automatically a useful
        comp.
      - corporate_investor_events: for Tier 2 public REIT peers - material guidance changes,
        dividend changes, significant buybacks or equity issuance, strategic reviews, activist
        campaigns or material ownership filings, significant rating-agency actions, and other
        events that meaningfully change the peer's growth outlook, balance sheet, capital
        allocation, valuation narrative, strategy or investor perception. These shape the
        comparison set your own investors use. Exclude routine ATM activity, ordinary rating
        affirmations, immaterial ownership filings and other technical capital-markets activity
        that does not materially change the peer comparison.

      EXCLUDE (set is_relevant=false and fill reason_if_excluded):
      - Routine corporate news with no competitive or supply implication.
      - Marketing, awards, sponsorships, ESG and CSR announcements, conference appearances.
      - Minor personnel changes below the executive or team-lead level.
      - Opinion pieces, market-wide commentary not specific to the firm, and articles that merely
        mention the firm in passing.
      - Exception: market-wide commentary is excluded, but a specific transaction or lease inside a
        broader market piece still counts if it establishes a comp or a supply event in a market of
        interest. Extract the specific event.
      - Routine leasing announcements that do not establish a meaningful competitive rent,
        occupancy, concession or tenant-demand signal.
      - Early-stage development activity with no evidence that material competing supply is likely
        to proceed; retain it as a watchlist indicator when appropriate.
      - Routine refinancing, credit-facility activity, equity issuance or other capital activity
        that does not materially change a competitor's financial capacity, strategy or peer
        valuation narrative.
      - A single weak competitive indicator with no concrete implication. Retain it in the
        watchlist and elevate it only if later developments create a meaningful pattern.

      MARKET SCOPING: for every finding, state whether it falls inside a market of interest and, if
      determinable, name the competing submarket and product type. Events inside a market of
      interest are weighted one priority level higher than the same event elsewhere. Tier 2
      corporate and investor events are exempt from geographic weighting, since their relevance is
      valuation-based rather than location-based.

      PRIORITY rubric:
      - high: an act-this-week signal. Competing supply landing in a submarket you own, a tenant
        you want being signed elsewhere, or a deal you could still bid on.
      - medium: a real competitive signal worth tracking with no immediate action attached.
      - low: a potentially useful competitive indicator that has not crossed the threshold for a
        standalone alert. Retain it in the watchlist/background layer rather than sending it as a
        normal alert unless specifically requested.

      CEO FLAG, separate from priority: set ceo_flag=true when the item is important enough to
      merit inclusion in a short CEO briefing and could reasonably surface in an analyst question,
      on a peer comparison slide, in the financial press alongside your company, or in a board
      conversation. This includes a material transaction establishing an important
      pricing/valuation comp; a material Tier 2 guidance, dividend, capital-allocation or strategic
      change; activism or a strategic review; a peer materially entering or exiting a market or
      segment you are in; meaningful competing development in one of your submarkets; a competitor
      signing or actively courting one of your important tenants or prospects; or a leadership
      change that signals a meaningful strategic shift at a direct competitor.
      Do not set ceo_flag merely because an event technically fits a relevant category. If the
      competitive implication is minor or would require a long explanation to establish why the CEO
      should care, set ceo_flag=false. Priority answers "how fast should the team move"; the CEO
      flag answers "does leadership need to know."

    # Appended to `criteria` for this report type only (judge.criteria_for). The
    # competitors roster has no "#" column, so escalation on this side is tier-based
    # rather than rank-based, and the tier is inferred rather than supplied.
    tier_note: |
      COMPETITOR TIERS -> ESCALATION: no rank is supplied for competitors. Infer the firm's tier
      from what you know about it, and use the tier only to adjust escalation:
      - Tier 1, direct submarket competitors: firms that own or operate competing product in a
        market of interest. Their leasing, development, and pricing moves affect your rent roll
        directly. Escalate: medium becomes high when the event lands in a market of interest.
      - Tier 2, public REIT peers and sector comps: companies whose disclosures, trades, and
        capital decisions shape analyst expectations and relative valuation, whether or not they
        own next door. Their corporate and investor events matter as much as their property events.
      - Tier 3, institutional capital entrants: private equity, sovereign, and institutional buyers
        moving into or out of a market of interest. Their entries and exits move pricing and bid
        competition. Standard rubric; escalate only on a closed or announced transaction in a
        market of interest.
      - Tier never suppresses a finding. Every firm on the roster is in scope; tier only adjusts
        escalation.
